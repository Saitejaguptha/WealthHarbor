    <title>wealthharbor</title>
    <script>
      // Shim to handle page refreshes on sub-routes when using HashRouter
      (function() {
        var path = window.location.pathname;
        if (path && path !== '/' && !window.location.hash) {
          window.location.replace(window.location.origin + window.location.search + '/#' + path);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
